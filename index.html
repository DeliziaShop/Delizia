<meta charset="UTF-8">

<title>Delizia</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, sans-serif; background: #fafafa; color: #222; padding-bottom: 60px; }

.head { background: #1a1610; color: #f5e8c8; padding: 20px 16px; text-align: center; }
.head h1 { font-size: 32px; font-style: italic; color: #d4a84a; }
.head p { font-size: 12px; color: #aaa; margin-top: 4px; letter-spacing: 2px; }

.controls { background: white; padding: 10px; border-bottom: 1px solid #ddd; position: sticky; top: 0; z-index: 10; }
.controls input[type=search] { width: 100%; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; }
.row2 { display: flex; gap: 8px; margin-top: 8px; align-items: center; flex-wrap: wrap; }
.row2 select { flex: 1; padding: 8px; font-size: 14px; border: 1px solid #ccc; border-radius: 6px; background: white; min-width: 140px; }
.row2 label { font-size: 14px; display: flex; align-items: center; gap: 6px; }

.stats { padding: 8px 12px; font-size: 13px; color: #666; background: #f0f0f0; border-bottom: 1px solid #ddd; }
.stats b { color: #1a1610; }

.sec { background: #1a1610; color: #d4a84a; padding: 10px 14px; font-weight: bold; font-size: 16px; margin-top: 12px; }

.list { background: white; }
.item { padding: 12px 14px; border-bottom: 1px solid #eee; display: flex; gap: 12px; align-items: center; }
.item-pic { width: 60px; height: 60px; flex-shrink: 0; background: #f5f0e6; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 28px; overflow: hidden; }
.item-pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.item-info { flex: 1; min-width: 0; }
.item-name { font-weight: 600; font-size: 15px; line-height: 1.3; color: #222; }
.item-name.hit::before { content: "★ "; color: #d4a84a; }
.item-weight { font-size: 13px; color: #888; margin-top: 2px; }
.item-right { text-align: right; flex-shrink: 0; }
.item-price { font-size: 17px; font-weight: bold; color: #b8862c; white-space: nowrap; }
.badge { display: inline-block; font-size: 11px; padding: 2px 7px; border-radius: 3px; margin-top: 4px; font-weight: 600; }
.badge.in { background: #e8f5e8; color: #2e6b2e; }
.badge.out { background: #f8e8e0; color: #a04020; }

.gift { padding: 14px; border-bottom: 1px solid #eee; background: white; }
.gift-name { font-weight: bold; font-size: 16px; color: #222; margin-bottom: 6px; }
.gift-desc { font-size: 13px; color: #666; line-height: 1.5; margin-bottom: 8px; }
.gift-bottom { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.gift-price { font-size: 18px; font-weight: bold; color: #b8862c; }
.tg-btn { font-size: 12px; padding: 5px 12px; background: #d4a84a; color: white; text-decoration: none; border-radius: 4px; }

.foot { padding: 24px 16px; text-align: center; font-size: 13px; background: #1a1610; color: #aaa; margin-top: 20px; }
.foot a { color: #d4a84a; text-decoration: none; }
.foot h3 { color: #d4a84a; font-style: italic; font-size: 22px; margin-bottom: 10px; }

.empty { padding: 40px 20px; text-align: center; color: #999; }
</style>

var CORD = ["parm","gouda","brie","brun","ched","other","hamon","oil"];

var cat = "all", q = "", only = false;

function esc(s) { return String(s).replace(/[&<>"]/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

function render() {
  var content = document.getElementById("content");
  var statsEl = document.getElementById("stats");
  var html = "";

  var fp = (cat === "gift") ? [] : PRODS.filter(function(p) {
    var catOk = (cat === "all" || p.c === cat);
    var searchOk = (!q || p.n.toLowerCase().indexOf(q.toLowerCase()) !== -1);
    var stockOk = (!only || p.s);
    return catOk && searchOk && stockOk;
  });

  var fg = (cat !== "all" && cat !== "gift") ? [] : GIFTS.filter(function(g) {
    var searchOk = (!q || g.n.toLowerCase().indexOf(q.toLowerCase()) !== -1);
    var stockOk = (!only || g.s);
    return searchOk && stockOk;
  });

  var total = fp.length + fg.length;
  var inCount = 0;
  for (var i=0; i<fp.length; i++) if (fp[i].s) inCount++;
  for (var i=0; i<fg.length; i++) if (fg[i].s) inCount++;

  statsEl.innerHTML = "Всего: <b>" + total + "</b> · В наличии: <b>" + inCount + "</b> · Нет: <b>" + (total - inCount) + "</b>";

  if (total === 0) {
    content.innerHTML = '<div class="empty">Ничего не найдено</div>';
    return;
  }

  if (fp.length) {
    var cats = (cat === "all") ? CORD.filter(function(c){ return fp.some(function(p){return p.c===c;}); }) : [cat];
    for (var ci=0; ci<cats.length; ci++) {
      var c = cats[ci];
      var items = fp.filter(function(p){ return p.c === c; });
      if (!items.length) continue;
      html += '<div class="sec">' + esc(CL[c]) + ' <span style="float:right;font-weight:normal;font-size:13px">' + items.length + '</span></div>';
      html += '<div class="list">';
      for (var i=0; i<items.length; i++) {
        var p = items[i];
        var inS = p.s;
        var pic;
        if (p.img) {
          pic = '<img src="' + esc(p.img) + '" alt="" onerror="this.parentNode.innerHTML=\'' + ICONS[p.c] + '\'">';
        } else {
          pic = ICONS[p.c];
        }
        html += '<div class="item">';
        html += '<div class="item-pic">' + pic + '</div>';
        html += '<div class="item-info">';
        html += '<div class="item-name' + (p.hit ? ' hit' : '') + '">' + esc(p.n) + '</div>';
        html += '<div class="item-weight">' + esc(p.w) + '</div>';
        html += '<span class="badge ' + (inS ? 'in' : 'out') + '">' + (inS ? '✓ В наличии' : '✗ Нет') + '</span>';
        html += '</div>';
        html += '<div class="item-right"><div class="item-price">' + esc(p.p) + ' ₽</div></div>';
        html += '</div>';
      }
      html += '</div>';
    }
  }

  if (fg.length) {
    html += '<div class="sec">🎁 Подарочные наборы <span style="float:right;font-weight:normal;font-size:13px">' + fg.length + '</span></div>';
    for (var i=0; i<fg.length; i++) {
      var g = fg[i];
      var inS = g.s;
      html += '<div class="gift">';
      html += '<div class="gift-name">' + esc(g.n) + '</div>';
      html += '<div class="gift-desc">' + esc(g.d) + '</div>';
      html += '<div class="gift-bottom">';
      html += '<div class="gift-price">' + esc(g.p) + ' ₽</div>';
      html += '<div>';
      html += '<span class="badge ' + (inS ? 'in' : 'out') + '">' + (inS ? '✓ Есть' : '✗ Нет') + '</span> ';
      html += '<a class="tg-btn" href="https://t.me/DeliziaManager">Заказать</a>';
      html += '</div>';
      html += '</div></div>';
    }
  }

  content.innerHTML = html;
}

document.getElementById("cat-select").addEventListener("change", function(e){ cat = e.target.value; render(); });
document.getElementById("search").addEventListener("input", function(e){ q = e.target.value; render(); });
document.getElementById("only-in").addEventListener("change", function(e){ only = e.target.checked; render(); });
